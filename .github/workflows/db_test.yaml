# Purpose: To ensure DB integrity

name: pull request test

# Triggred when pull request to main is opened
on: 
  pull_request:
    types:
    - opened
    branches:
    - main
  workflow_dispatch:

jobs:
  laravel_test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: laravel
          MYSQL_USER: sail
          MYSQL_PASSWORD: password
        ports:
        - 3306:3306

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_mysql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare environment
        run: cp .env.example env

      - name: Genetate application key
        run: php artsian key:generate

      - name: Configure database
        run: |
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=laravel' .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=sail' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=password/' .env

      - name: Run migrations
        run: php artsian migrate --force

      - name: Run tests
        run: php artsian test